server:
  address: 127.0.0.1
  port: 8080
spring:
  application:
    name: ledgerflow
  datasource:
    url: jdbc:h2:file:./data/ledgerflow;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
